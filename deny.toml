# cargo-deny policy. Runs in CI (`.github/workflows/ci.yml`, job `deny`).
#
# Chosen over a bare `cargo audit` because it covers the same advisory database and adds
# licence policy, duplicate-version detection and source gating in one pass.

[advisories]
# Fail on any known vulnerability. This client handles API keys and TLS across ~180
# transitive crates, so an advisory is worth a red build.
yanked = "deny"

[licenses]
# Exactly what the locked graph actually contains — computed from Cargo.lock, not guessed,
# so that a new licence appearing is a deliberate decision rather than something already
# pre-authorised. Every entry below is the *only* option for at least one crate; licences
# that appear solely inside an `OR` that MIT or Apache-2.0 already satisfies are omitted.
allow = [
    "Apache-2.0",     # the project's own licence, and several dependencies'
    "MIT",            # the bulk of the tree
    "ISC",            # untrusted, rustls-webpki; also half of ring's "Apache-2.0 AND ISC"
    "Unicode-3.0",    # the ICU crates, reached via reqwest -> url -> idna
    "BSD-3-Clause",   # subtle
    # webpki-roots — Mozilla's CA root bundle. A data licence rather than a code one, and
    # unavoidable with rustls, which is how this client gets TLS.
    "CDLA-Permissive-2.0",
    # colored, via similar/mockito. Dev-dependency only: it colours test diffs and is never
    # linked into a published artifact. MPL-2.0 is file-level copyleft, so even if it were
    # linked it would not reach across into this code.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions of the same crate bloat the binary and usually mean a
# dependency needs updating rather than that two copies are genuinely required.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
