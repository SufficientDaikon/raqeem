name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # --locked: lint the dependency graph that is actually committed, not whatever
      # resolves fresh today.
      - run: cargo clippy --all-targets --locked -- -D warnings

  # cargo-deny subsumes cargo-audit's advisory check and adds licence policy, duplicate
  # versions and source gating — a broader net for the same one job.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The declared rust-version is load-bearing (cargo uses it to resolve) and was wrong
  # once already because nothing checked it. `check`, not `test`: this is the floor for
  # *consuming* the crates, so dev-only dependencies don't count.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
      # raqeem-python sits outside the workspace and is constrained separately by pyo3.
      - run: cargo check --manifest-path crates/raqeem-python/Cargo.toml --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The suite is fully offline — mocked HTTP, no API key, no model.
      - run: cargo test --all --locked
