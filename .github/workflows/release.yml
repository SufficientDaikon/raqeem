name: Release

# Tag a version to cut a release with prebuilt binaries:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: raqeem-x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            name: raqeem-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            name: raqeem-x86_64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: raqeem-x86_64-windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked --target ${{ matrix.target }} -p raqeem-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release raqeem

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/raqeem.exe -DestinationPath ${{ matrix.name }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
